[project]
name = "btc-scalping-bot"
version = "0.1.0"
description = "BTC/JPY scalping bot using the bitFlyer Lightning API (strategy-agnostic, mock-first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "ta>=0.11",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "dash>=2.17",
    "plotly>=5.22",
    "scipy>=1.13",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "pandas-stubs",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

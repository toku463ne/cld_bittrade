# nginx reverse proxy for the always-on Dash viz.
# Installed by scripts/setup_viz_service.sh (substitutes @VIZ_PORT@). The Dash app
# binds 127.0.0.1:@VIZ_PORT@ (loopback only); nginx is the sole internet-facing
# entry point, listening on all interfaces (0.0.0.0:80) so it is reachable from
# the public IP — gate access in the AWS security group (allow :80 from your IP).
#
# NOTE: this is plain HTTP with no auth. With :80 open to the internet, restrict
# the source in the security group (/ ufw) — or add TLS + basic-auth — before use.
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:@VIZ_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (harmless when Dash uses plain HTTP callbacks).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The Live tab pulls ~25 days of GMO klines on a cold Refresh (~7 s);
        # give callbacks generous headroom.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
